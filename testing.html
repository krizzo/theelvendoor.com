<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <style>
        body {
            background-color: rgb(128, 128, 128);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        #WestGate {
            display: none; /* Hidden by default, shown only at night */
            max-width: 80vw;
            max-height: 80vh;
            filter: drop-shadow(0 0 20px #4da6ff) drop-shadow(0 0 40px #0080ff) drop-shadow(0 0 60px #0066cc);
        }

        /* Purple theme for November 15th */
        #WestGate.purple {
            filter: drop-shadow(0 0 20px #9966ff) drop-shadow(0 0 40px #7f4dff) drop-shadow(0 0 60px #6633cc);
        }

        #WestGate.glow {
            animation: pulse 3s ease-in-out infinite alternate;
        }

        #WestGate.purple.glow {
            animation: pulsePurple 3s ease-in-out infinite alternate;
        }

        /* Dynamically change all stroke colors to blue when WestGate is visible */
        #WestGate svg path {
            stroke: #4da6ff !important;
        }
        #WestGate svg ellipse {
            stroke: #4da6ff !important;
        }
        #WestGate svg circle {
            stroke: #4da6ff !important;
        }

        /* Purple stroke colors for November 15th */
        #WestGate.purple svg path {
            stroke: #9966ff !important;
        }
        #WestGate.purple svg ellipse {
            stroke: #9966ff !important;
        }
        #WestGate.purple svg circle {
            stroke: #9966ff !important;
        }

        /* Change fill colors to blue for elements that are filled black - Firefox compatible */
        #WestGate svg path[style*="fill:#000"],
        #WestGate svg path[fill="#000"],
        #WestGate svg g[style*="fill:#000"],
        #WestGate svg g[fill="#000"] {
            fill: #4da6ff !important;
        }

        /* Purple fill colors for November 15th - Firefox compatible */
        #WestGate.purple svg path[style*="fill:#000"],
        #WestGate.purple svg path[fill="#000"],
        #WestGate.purple svg g[style*="fill:#000"],
        #WestGate.purple svg g[fill="#000"] {
            fill: #9966ff !important;
        }

        /* Ensure SVG scales properly */
        #WestGate svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        @keyframes pulse {
            0% {
                filter: drop-shadow(0 0 20px #4da6ff) drop-shadow(0 0 40px #0080ff) drop-shadow(0 0 60px #0066cc);
            }
            100% {
                filter: drop-shadow(0 0 30px #66b3ff) drop-shadow(0 0 60px #1a8cff) drop-shadow(0 0 90px #0073e6);
            }
        }

        @keyframes pulsePurple {
            0% {
                filter: drop-shadow(0 0 20px #9966ff) drop-shadow(0 0 40px #7f4dff) drop-shadow(0 0 60px #6633cc);
            }
            100% {
                filter: drop-shadow(0 0 30px #b380ff) drop-shadow(0 0 60px #9966ff) drop-shadow(0 0 90px #7f4dff);
            }
        }

        #timeInfo {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }

        #controls {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
        }

        #controls button {
            background-color: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #controls button:hover {
            background-color: #555;
        }

        #controls button.active {
            background-color: #666;
            border-color: #888;
        }

        .night-mode {
            background-color: rgb(64, 64, 64) !important;
        }
    </style>
    <title>Testing Page - Doors of Durin</title>
    <meta name="description" content="Testing page with night-time WestGate display">
    <meta name="author" content="Kyle (krizzo) Rizzo">
</head>

<body>
    <div id="container">
        <div id="WestGate" class="glow"></div>
        <div id="timeInfo">
            <p id="currentTime"></p>
            <p id="nightStatus"></p>
        </div>
        <div id="controls">
            <p>Testing Controls:</p>
            <button id="toggleNov15">Toggle Nov 15th Theme</button>
            <button id="resetOverrides">Reset All Overrides</button>
        </div>
    </div>

    <script>
        let manualOverride = false;
        let manualNightMode = false;
        let manualNov15Override = false;
        let manualNov15Mode = false;
        let svgLoaded = false;

        // Load SVG content dynamically
        async function loadSVG() {
            if (svgLoaded) return;

            try {
                const response = await fetch('imgs/WestGate.svg');
                const svgText = await response.text();
                document.getElementById('WestGate').innerHTML = svgText;
                svgLoaded = true;

                // Apply color changes programmatically for better browser compatibility
                applyColorChanges();
            } catch (error) {
                console.error('Failed to load SVG:', error);
            }
        }

        // Apply color changes programmatically for Firefox compatibility
        function applyColorChanges(forceNov15 = null) {
            const westGate = document.getElementById('WestGate');
            const svg = westGate.querySelector('svg');
            if (!svg) return;

            let isNov15;
            if (forceNov15 !== null) {
                // Use the forced value (for immediate updates during toggles)
                isNov15 = forceNov15;
            } else {
                // Use the current state logic
                const now = new Date();
                const month = now.getMonth();
                const date = now.getDate();
                const actualNov15 = month === 10 && date === 15;
                isNov15 = manualNov15Override ? manualNov15Mode : actualNov15;
            }

            const blueColor = '#4da6ff';
            const purpleColor = '#9966ff';
            const targetColor = isNov15 ? purpleColor : blueColor;

            // Find all elements with black fill and change them
            const elementsToChange = svg.querySelectorAll('path[style*="fill:#000"], g[style*="fill:#000"], path[fill="#000"], g[fill="#000"]');

            elementsToChange.forEach(element => {
                element.style.fill = targetColor;
                // Also set the fill attribute for maximum compatibility
                element.setAttribute('fill', targetColor);
            });
        }

        function updateTimeAndDisplay() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const month = now.getMonth(); // 0-based (November = 10)
            const date = now.getDate();

            // Format time as HH:MM:SS
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Check if it's November 15th (with manual override)
            const actualNov15 = month === 10 && date === 15;
            const isNov15 = manualNov15Override ? manualNov15Mode : actualNov15;

            // Consider night time as 6 PM (18:00) to 6 AM (06:00)
            const isNightTime = hours >= 18 || hours < 6;

            // Update time display
            document.getElementById('currentTime').textContent = `Current time: ${timeString}`;

            // Update night status and show/hide WestGate
            const westGate = document.getElementById('WestGate');
            const nightStatus = document.getElementById('nightStatus');
            const body = document.body;

            // Use manual override if active, otherwise use actual time
            const shouldShowNightMode = manualOverride ? manualNightMode : isNightTime;

            if (shouldShowNightMode) {
                // Load SVG if not already loaded
                loadSVG();
                westGate.style.display = 'block';

                // Apply purple theme on November 15th
                if (isNov15) {
                    westGate.classList.add('purple');
                    let statusText = '';
                    if (manualOverride && manualNov15Override) {
                        statusText = 'Manual overrides - WestGate is glowing purple (Nov 15th override) (click to toggle night)';
                    } else if (manualOverride) {
                        statusText = 'Manual night override - WestGate is glowing purple (Nov 15th) (click to toggle night)';
                    } else if (manualNov15Override) {
                        statusText = 'Night time - WestGate is glowing purple (Nov 15th override) (click to override night)';
                    } else {
                        statusText = 'Night time - WestGate is glowing purple (Nov 15th) (click to override night)';
                    }
                    nightStatus.textContent = statusText;
                    nightStatus.style.color = '#b380ff';
                } else {
                    westGate.classList.remove('purple');
                    let statusText = '';
                    if (manualOverride && manualNov15Override) {
                        statusText = 'Manual overrides - WestGate is glowing (Nov 15th override off) (click to toggle night)';
                    } else if (manualOverride) {
                        statusText = 'Manual night override - WestGate is glowing (click to toggle night)';
                    } else if (manualNov15Override) {
                        statusText = 'Night time - WestGate is glowing (Nov 15th override off) (click to override night)';
                    } else {
                        statusText = 'Night time - WestGate is glowing (click to override night)';
                    }
                    nightStatus.textContent = statusText;
                    nightStatus.style.color = '#66b3ff';
                }

                // Apply color changes after theme is set
                if (svgLoaded) {
                    applyColorChanges(isNov15);
                }

                body.classList.add('night-mode');
            } else {
                westGate.style.display = 'none';
                westGate.classList.remove('purple');
                let statusText = '';
                if (manualOverride && manualNov15Override) {
                    statusText = 'Manual overrides - WestGate is hidden (Nov 15th override active) (click to toggle night)';
                } else if (manualOverride) {
                    statusText = 'Manual night override - WestGate is hidden (click to toggle night)';
                } else if (manualNov15Override) {
                    statusText = 'Day time - WestGate is hidden (Nov 15th override active) (click to override night)';
                } else {
                    statusText = 'Day time - WestGate is hidden (click to override night)';
                }
                nightStatus.textContent = statusText;
                nightStatus.style.color = '#cccccc';
                body.classList.remove('night-mode');
            }
        }

        // Update immediately when page loads
        updateTimeAndDisplay();

        // Update every second
        setInterval(updateTimeAndDisplay, 1000);

        // For testing purposes, you can manually toggle night mode by clicking on the time info
        document.getElementById('timeInfo').addEventListener('click', function() {
            if (manualOverride) {
                // If already in manual mode, toggle the night mode state
                manualNightMode = !manualNightMode;
            } else {
                // Enter manual override mode and toggle current state
                manualOverride = true;
                const now = new Date();
                const hours = now.getHours();
                const isCurrentlyNight = hours >= 18 || hours < 6;
                manualNightMode = !isCurrentlyNight; // Toggle opposite of current time
            }

            // Immediately update display
            updateTimeAndDisplay();
            updateButtonStates();
        });

        // Double-click to exit manual override mode
        document.getElementById('timeInfo').addEventListener('dblclick', function() {
            manualOverride = false;
            updateTimeAndDisplay();
            updateButtonStates();
        });

        // November 15th toggle button
        document.getElementById('toggleNov15').addEventListener('click', function() {
            if (manualNov15Override) {
                // If already in manual mode, toggle the Nov 15th state
                manualNov15Mode = !manualNov15Mode;
            } else {
                // Enter manual override mode and toggle current state
                manualNov15Override = true;
                const now = new Date();
                const month = now.getMonth();
                const date = now.getDate();
                const actualNov15 = month === 10 && date === 15;
                manualNov15Mode = !actualNov15; // Toggle opposite of current date
            }

            // Immediately apply color changes if SVG is loaded
            if (svgLoaded) {
                applyColorChanges(manualNov15Mode);
            }

            updateTimeAndDisplay();
            updateButtonStates();
        });

        // Reset all overrides button
        document.getElementById('resetOverrides').addEventListener('click', function() {
            manualOverride = false;
            manualNov15Override = false;

            // Immediately apply color changes if SVG is loaded
            if (svgLoaded) {
                const now = new Date();
                const month = now.getMonth();
                const date = now.getDate();
                const actualNov15 = month === 10 && date === 15;
                applyColorChanges(actualNov15);
            }

            updateTimeAndDisplay();
            updateButtonStates();
        });

        // Function to update button states
        function updateButtonStates() {
            const nov15Button = document.getElementById('toggleNov15');
            const resetButton = document.getElementById('resetOverrides');

            if (manualNov15Override) {
                nov15Button.classList.add('active');
                nov15Button.textContent = manualNov15Mode ? 'Nov 15th: ON (click to toggle)' : 'Nov 15th: OFF (click to toggle)';
            } else {
                nov15Button.classList.remove('active');
                nov15Button.textContent = 'Toggle Nov 15th Theme';
            }

            if (manualOverride || manualNov15Override) {
                resetButton.classList.add('active');
            } else {
                resetButton.classList.remove('active');
            }
        }

        // Initialize button states
        updateButtonStates();
    </script>
</body>
</html>
